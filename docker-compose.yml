version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mycrm-db
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - mycrm-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sequenceit-git/mycrm:latest
    container_name: mycrm-app
    restart: always
    environment:
      - PORT=8888
      - DATABASE=mongodb://mongodb:27017/idurar
      - SECRET=mycrm_super_secret_jwt_key_2026
      - JWT_SECRET=mycrm_jwt_secret_token_2026
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - mycrm-net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mycrm.rule=Host(`mycrm.sequenceit.software`)"
      - "traefik.http.routers.mycrm.entrypoints=websecure"
      - "traefik.http.routers.mycrm.tls=true"
      - "traefik.http.routers.mycrm.tls.certresolver=letsencrypt"
      - "traefik.http.services.mycrm.loadbalancer.server.port=8888"

volumes:
  mongodb_data:

networks:
  mycrm-net:
    driver: bridge
  proxy:
    external: true
