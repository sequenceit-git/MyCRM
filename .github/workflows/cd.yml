name: CD - Build, Publish & Deploy

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: 'Deploy to VPS after building Docker image?'
        required: true
        type: boolean
        default: true
      run_db_setup:
        description: 'Run initial database setup script on VPS?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    needs: build-and-push
    if: |
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_to_vps == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Secrets Availability
        id: check_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_USERNAME }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::warning ::VPS deployment secrets (VPS_HOST, VPS_USERNAME, VPS_SSH_KEY) are not set. Skipping automated VPS SSH deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH to VPS
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/root/MyCRM' }}"
            echo "🚀 [Deploy] Navigating to deployment directory: ${DEPLOY_DIR}"
            
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "⚠️ Directory $DEPLOY_DIR not found. Creating and cloning repository..."
              mkdir -p "$DEPLOY_DIR"
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi
            
            cd "$DEPLOY_DIR"

            echo "🌐 [Deploy] Verifying external proxy network..."
            docker network create proxy 2>/dev/null || true

            if [ -d .git ]; then
              echo "📥 [Deploy] Updating repository source..."
              git fetch origin master
              git reset --hard origin/master
            fi

            echo "🔑 [Deploy] Authenticating with GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            echo "🐳 [Deploy] Pulling newest application image & restarting containers..."
            docker compose pull app 2>/dev/null || true
            docker compose up -d --build --remove-orphans

            if [ "${{ inputs.run_db_setup }}" = "true" ]; then
              echo "🌱 [Deploy] Running initial database setup..."
              docker exec mycrm-app npm run setup || true
            fi

            echo "🧹 [Deploy] Cleaning up unused old Docker images..."
            docker image prune -f

            echo "✅ [Deploy] Deployment completed successfully!"
